<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>动态爱心页面</title>
    <style>
        /* 重置基础样式并设置浪漫渐变背景 */
        body, html {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: linear-gradient(135deg, #120318, #2e0828);
            font-family: sans-serif;
        }

        /* 容纳所有爱心的容器 */
        #container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; /* 让事件穿透到子元素 */
        }

        /* 爱心外层包裹器：负责移动位置，捕捉鼠标事件 */
        .heart-wrapper {
            position: absolute;
            pointer-events: auto;
            cursor: pointer;
            will-change: transform;
        }

        /* 实际的爱心元素：负责显示、悬停变大和呼吸动画 */
        .heart {
            width: 100%;
            height: 100%;
            /* 使用内置的 SVG 作为爱心图案，性能更好且边缘平滑 */
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%23ff3366"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>');
            background-size: cover;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            filter: drop-shadow(0 0 8px rgba(255, 51, 102, 0.6));
            animation: pulse 2s infinite ease-in-out alternate;
        }

        /* 鼠标悬停变大，并停止呼吸动画 */
        .heart-wrapper:hover .heart {
            transform: scale(1.6) rotate(5deg);
            filter: drop-shadow(0 0 20px rgba(255, 51, 102, 1));
            animation: none; 
        }

        /* 呼吸动画关键帧 */
        @keyframes pulse {
            0% { transform: scale(0.95); }
            100% { transform: scale(1.05); }
        }

        /* 爆炸后的小小爱心 */
        .particle {
            position: absolute;
            pointer-events: none;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%23ff6699"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>');
            background-size: cover;
            will-change: transform, opacity;
        }
    </style>
</head>
<body>
    <div id="container"></div>

    <script>
        const container = document.getElementById('container');
        const hearts = [];
        const particles = [];

        // 生成范围内的随机数
        const random = (min, max) => Math.random() * (max - min) + min;

        // 【主要爱心类】
        class Heart {
            constructor() {
                this.el = document.createElement('div');
                this.el.className = 'heart-wrapper';
                
                // 不均匀的大小
                this.size = random(30, 80);
                this.el.style.width = `${this.size}px`;
                this.el.style.height = `${this.size}px`;

                const innerHeart = document.createElement('div');
                innerHeart.className = 'heart';
                // 随机微调每个爱心的色相，让颜色有丰富的层次感
                const hue = random(-40, 40);
                innerHeart.style.filter = `drop-shadow(0 0 8px rgba(255, 51, 102, 0.6)) hue-rotate(${hue}deg)`;
                this.el.appendChild(innerHeart);

                // 初始随机位置
                this.x = random(0, window.innerWidth - this.size);
                this.y = random(0, window.innerHeight - this.size);
                
                // 初始随机速度
                this.vx = random(-1.5, 1.5);
                this.vy = random(-1.5, 1.5);

                this.el.style.transform = `translate(${this.x}px, ${this.y}px)`;

                // 绑定点击爆炸事件
                this.el.addEventListener('click', (e) => {
                    this.explode(e.clientX, e.clientY);
                    this.respawn(); // 炸碎后在其他地方重生一个新的，保持屏幕满盈
                });

                container.appendChild(this.el);
            }

            // 爆炸逻辑
            explode(clientX, clientY) {
                // 生成 15 到 25 个小小爱心碎片
                const particleCount = Math.floor(random(15, 25));
                for(let i = 0; i < particleCount; i++) {
                    particles.push(new Particle(clientX, clientY));
                }
            }

            // 重生逻辑（被点击后瞬间传送到屏幕其他位置）
            respawn() {
                this.x = random(0, window.innerWidth - this.size);
                this.y = random(0, window.innerHeight - this.size);
            }

            // 每一帧更新位置（不规律乱动）
            update() {
                // 模拟布朗运动，每一帧稍微改变一点点速度方向
                this.vx += (Math.random() - 0.5) * 0.2;
                this.vy += (Math.random() - 0.5) * 0.2;

                // 限制最高速度
                const speedLimit = 2.5;
                if (this.vx > speedLimit) this.vx = speedLimit;
                if (this.vx < -speedLimit) this.vx = -speedLimit;
                if (this.vy > speedLimit) this.vy = speedLimit;
                if (this.vy < -speedLimit) this.vy = -speedLimit;

                this.x += this.vx;
                this.y += this.vy;

                // 碰到屏幕边缘反弹
                if (this.x < 0) { this.x = 0; this.vx *= -1; }
                if (this.x > window.innerWidth - this.size) { this.x = window.innerWidth - this.size; this.vx *= -1; }
                if (this.y < 0) { this.y = 0; this.vy *= -1; }
                if (this.y > window.innerHeight - this.size) { this.y = window.innerHeight - this.size; this.vy *= -1; }

                this.el.style.transform = `translate(${this.x}px, ${this.y}px)`;
            }
        }

        // 【小小爱心粒子类】（用于爆炸效果）
        class Particle {
            constructor(x, y) {
                this.el = document.createElement('div');
                this.el.className = 'particle';
                this.size = random(10, 20); // 爆炸后的粒子很小
                this.el.style.width = `${this.size}px`;
                this.el.style.height = `${this.size}px`;

                this.x = x - this.size / 2;
                this.y = y - this.size / 2;
                
                // 360度随机发射
                const angle = random(0, Math.PI * 2);
                const speed = random(3, 12);
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
                
                // 物理重力和生命周期衰减
                this.gravity = 0.3;
                this.life = 1;
                this.decay = random(0.015, 0.03); // 淡出速度

                // 颜色随机微调
                const hue = random(-50, 50);
                this.el.style.filter = `hue-rotate(${hue}deg)`;

                container.appendChild(this.el);
            }

            update() {
                this.vy += this.gravity; // 加上重力向下掉落
                this.x += this.vx;
                this.y += this.vy;
                this.life -= this.decay;

                // 运用缓动效果缩小并淡出
                this.el.style.transform = `translate(${this.x}px, ${this.y}px) scale(${this.life})`;
                this.el.style.opacity = this.life;

                // 生命周期结束后销毁DOM节点
                if (this.life <= 0) {
                    this.el.remove();
                }
            }
        }

        // 初始化：在屏幕上生成 35 个大爱心
        for(let i = 0; i < 35; i++) {
            hearts.push(new Heart());
        }

        // 核心动画循环
        function animate() {
            // 更新大爱心
            hearts.forEach(heart => heart.update());
            
            // 更新爆炸的小小爱心，并清理已消失的粒子
            for(let i = particles.length - 1; i >= 0; i--) {
                particles[i].update();
                if(particles[i].life <= 0) {
                    particles.splice(i, 1);
                }
            }

            requestAnimationFrame(animate);
        }

        // 启动动画
        animate();

    </script>
</body>
</html>
